services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      NIDS_RUN_ID: ${NIDS_RUN_ID:?set NIDS_RUN_ID to a trained run_id under models/runs -- see docs/DEPLOYMENT.md}
      NIDS_ANOMALY_RUN_ID: ${NIDS_ANOMALY_RUN_ID:-}
      NIDS_ARTIFACT_ROOT: /app/models/runs
      NIDS_DATABASE_URL: sqlite:////data/history.db
      NIDS_ALERT_THRESHOLD: ${NIDS_ALERT_THRESHOLD:-70}
      NIDS_CORS_ORIGINS: ${NIDS_CORS_ORIGINS:-http://localhost:8080}
      NIDS_SECRET_KEY: ${NIDS_SECRET_KEY:?set NIDS_SECRET_KEY to a random string -- see docs/DEPLOYMENT.md}
      NIDS_LOG_LEVEL: ${NIDS_LOG_LEVEL:-INFO}
      NIDS_LOG_FORMAT: ${NIDS_LOG_FORMAT:-json}
      NIDS_PAIRING_RATE_LIMIT_PER_MINUTE: ${NIDS_PAIRING_RATE_LIMIT_PER_MINUTE:-20}
      NIDS_INFERENCE_RATE_LIMIT_PER_MINUTE: ${NIDS_INFERENCE_RATE_LIMIT_PER_MINUTE:-120}
      NIDS_MAX_UPLOAD_SIZE_BYTES: ${NIDS_MAX_UPLOAD_SIZE_BYTES:-10000000}
      NIDS_SLACK_WEBHOOK_URL: ${NIDS_SLACK_WEBHOOK_URL:-}
      NIDS_SMTP_HOST: ${NIDS_SMTP_HOST:-}
      NIDS_SMTP_PORT: ${NIDS_SMTP_PORT:-587}
      NIDS_SMTP_USERNAME: ${NIDS_SMTP_USERNAME:-}
      NIDS_SMTP_PASSWORD: ${NIDS_SMTP_PASSWORD:-}
      NIDS_SMTP_FROM: ${NIDS_SMTP_FROM:-}
      NIDS_SMTP_TO: ${NIDS_SMTP_TO:-}
      NIDS_NOTIFICATION_MIN_SEVERITY: ${NIDS_NOTIFICATION_MIN_SEVERITY:-high}
    volumes:
      # Trained runs are produced by `python -m nids.training` on the
      # host (see docs/DATASET.md) and never baked into the image --
      # read-only because the API only ever reads a run, never writes one.
      - ./models/runs:/app/models/runs:ro
      # Prediction/alert history (nids.api.store) -- a named volume, not
      # a bind mount, so it survives `docker compose down` without
      # littering the repo with a history.db file.
      - nids-history-db:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vite bakes this into the JS bundle at build time (see
        # frontend/src/api/client.ts) -- it must be the URL the *browser*
        # reaches the backend at, not a Docker-network-internal hostname.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost -- nginx only listens on 0.0.0.0 (IPv4),
      # but the container's /etc/hosts resolves "localhost" to ::1 first,
      # so wget would try IPv6, get connection refused, and report
      # unhealthy even though the site serves fine over IPv4.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  nids-history-db:
