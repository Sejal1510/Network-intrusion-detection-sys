[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nids"
version = "0.1.0"
description = "AI-powered Network Intrusion Detection Platform"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "catboost>=1.2",
    "scikit-learn>=1.3",
    "shap>=0.45",
    "mlflow>=2.14",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "scapy>=2.5",
    "redis>=5.0",
    "itsdangerous>=2.1",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "httpx2>=2.0",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.20",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nids.api" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
