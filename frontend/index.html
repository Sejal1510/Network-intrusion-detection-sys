<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NIDS Dashboard</title>
    <script>
      // Applies a stored manual theme override (see src/hooks/useTheme.ts)
      // before first paint, so a returning user doesn't see a flash of the
      // OS-default theme before React mounts and corrects it.
      try {
        var t = localStorage.getItem("nids-theme")
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
